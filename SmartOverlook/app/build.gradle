plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smartoverlook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartoverlook'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// Give the generated APK a recognizable filename instead of app-debug.apk.
android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "SmartOverlook.apk"
    }
}
